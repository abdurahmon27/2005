# Refreshes the playlist shown in the yamu lab note (/lab/ideas/yamu).
#
# The daily schedule is off on purpose: GitHub-hosted runners live in the US
# and Yandex Music answers them with 451 (unavailable for legal reasons), so a
# scheduled run would be a green job that quietly changes nothing. Until this
# runs somewhere Yandex Music serves — a self-hosted runner, or a machine in
# the region running the CLI — the file is refreshed by hand.
#
#   curl -s -o /dev/null -w "%{http_code}\n" \
#     https://api.music.yandex.com/playlist/ch.448df3eb-daee-408a-a60a-252259db2f3b
#
# 200 means that machine can do it, 451 means it cannot.

name: music

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: abdurahmon27/yamu@v1
        with:
          playlist: "https://music.yandex.com/playlists/lk.8e7ddae2-aa05-4b5b-ad40-0c5b688370ec"
          limit: "6"
          out: "src/data/music.json"

      - name: commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/music.json
          git diff --staged --quiet || git commit -m "chore: refresh music"
          git push
