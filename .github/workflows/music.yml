# Refreshes the playlist shown on the home page.
#
# yamu reads the playlist from Yandex Music, writes src/data/music.json and
# commits it; Vercel rebuilds from that commit. Nothing is fetched while a
# visitor is on the page, and if Yandex has a bad day the committed file is
# simply left alone.

name: music

on:
  schedule:
    - cron: "0 4 * * *" # once a day, 09:00 in Tashkent
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: abdurahmon27/yamu@v1
        with:
          playlist: "https://music.yandex.com/playlists/lk.8e7ddae2-aa05-4b5b-ad40-0c5b688370ec"
          limit: "6"
          out: "src/data/music.json"

      - name: commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/music.json
          git diff --staged --quiet || git commit -m "chore: refresh music"
          git push
